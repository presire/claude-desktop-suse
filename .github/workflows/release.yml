name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Claude Desktop release this workflow builds (D-005). Bump it
  # together with CLAUDE_PINNED_VERSION and both SHA-256 values in
  # scripts/setup/detect-host.sh.
  CLAUDE_DESKTOP_VERSION: "5.1231.2"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: opensuse-leap-16
            container: opensuse/leap:16.0
            label: openSUSE Leap 16
          - distro: opensuse-tumbleweed
            container: opensuse/tumbleweed
            label: openSUSE Tumbleweed

    name: Build RPM (${{ matrix.label }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.container }}

    steps:
      - name: Install git and dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive dist-upgrade -y --no-recommends
          zypper --non-interactive install -y --no-recommends \
            git-core tar gzip xz curl ca-certificates \
            p7zip wget icoutils ImageMagick rpm-build \
            make gcc gcc-c++

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get tag metadata
        id: meta
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Extract Claude upstream version from tag (e.g., v1.3.2+claude1.1.799 -> 1.1.799;
          # older tags such as v3.2.3+1.21459.0 omit the word "claude").
          # A "+" suffix must be a complete version; otherwise a typo such
          # as "+claudefoo" would yield no version and skip the pin check.
          if [[ $tag == *+* ]]; then
            if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+(claude)?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Tag $tag must look like vX.Y.Z+claudeA.B.C"
              exit 1
            fi
            echo "claude_version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          fi

          # Extract wrapper version (e.g., v1.3.2+claude1.1.799 -> 1.3.2)
          wrapper_ver=$(echo "$tag" | grep -oP '^v\K[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "wrapper_version=$wrapper_ver" >> "$GITHUB_OUTPUT"

      # CI builds exactly CLAUDE_DESKTOP_VERSION; its SHA-256 lives only in
      # scripts/setup/detect-host.sh (D-005), so both versions must agree.
      # A tag that names another Claude version would publish a
      # mislabelled package, so it fails here as well.
      - name: Check tag and CI Claude version against the build pin
        env:
          TAG_CLAUDE_VERSION: ${{ steps.meta.outputs.claude_version }}
        run: |
          pinned=$(grep -oP "^CLAUDE_PINNED_VERSION='\K[^']+" scripts/setup/detect-host.sh)
          if [[ -z $pinned ]]; then
            echo "::error::CLAUDE_PINNED_VERSION not found in scripts/setup/detect-host.sh"
            exit 1
          fi
          if [[ $CLAUDE_DESKTOP_VERSION != "$pinned" ]]; then
            echo "::error::Workflow pins Claude $CLAUDE_DESKTOP_VERSION but scripts/setup/detect-host.sh pins $pinned"
            exit 1
          fi
          if [[ -n $TAG_CLAUDE_VERSION && $TAG_CLAUDE_VERSION != "$pinned" ]]; then
            echo "::error::Tag names Claude $TAG_CLAUDE_VERSION but the build pins $pinned"
            exit 1
          fi
          echo "Building pinned Claude $pinned"

      - name: Build RPM package
        run: |
          chmod +x build.sh
          bash build.sh --build rpm --clean no --release-tag "${{ steps.meta.outputs.tag }}" \
            --claude-version "$CLAUDE_DESKTOP_VERSION"

      - name: Verify patch markers
        run: bash scripts/verify-patches.sh build/electron-app

      # The build installs Node (build/node, when the image has none) and
      # asar (build/node_modules) for its own process only; the validator
      # needs both on PATH to unpack app.asar.
      - name: Validate RPM artifact
        run: PATH="$PWD/build/node/bin:$PWD/build/node_modules/.bin:$PATH" bash tests/test-artifact-rpm.sh .

      - name: Rename RPM with distro suffix
        id: artifact
        run: |
          rpm_file=$(find . -maxdepth 1 -name 'claude-desktop-*.rpm' -type f | head -n 1)
          if [[ -z $rpm_file ]]; then
            echo "::error::RPM file not found"
            exit 1
          fi

          base=$(basename "$rpm_file" .rpm)
          new_name="${base}.${{ matrix.distro }}.rpm"
          mv "$rpm_file" "$new_name"
          echo "rpm_file=$new_name" >> "$GITHUB_OUTPUT"
          echo "Built: $new_name"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}
          path: ${{ steps.artifact.outputs.rpm_file }}
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
      RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
    steps:
      # 署名検証にリポジトリの公開鍵 (gpg/RPM-GPG-KEY-Claude-Desktop-SUSE) を使う
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List artifacts
        run: ls -lh *.rpm

      # secret未設定でも失敗させず、無署名のまま公開する
      - name: Check RPM GPG config
        id: rpm-gpg
        run: |
          if [ -n "${RPM_GPG_PRIVATE_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RPM_GPG_PRIVATE_KEY is not set - publishing unsigned RPMs"
          fi

      - name: Sign RPMs with GPG
        if: steps.rpm-gpg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm gnupg
          export GNUPGHOME="$(mktemp -d)"
          RPMVERIFYDB="$(mktemp -d)"
          PASSPHRASE_FILE="$GNUPGHOME/passphrase"
          trap 'rm -rf "$GNUPGHOME" "$RPMVERIFYDB"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          test -n "$KEYID"
          printf '%s\n' "${RPM_GPG_PASSPHRASE:-}" > "$PASSPHRASE_FILE"
          chmod 600 "$PASSPHRASE_FILE"
          # Keep the distribution's default __gpg_sign_cmd: RPM4 and RPM6 pass
          # the signature/plaintext filenames differently, and RPM4.18 ships a
          # default __gpg of /usr/bin/gpg2 which Ubuntu does not provide.
          rpmsign \
            --define "__gpg /usr/bin/gpg" \
            --define "_gpg_name $KEYID" \
            --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file $PASSPHRASE_FILE" \
            --addsign ./*.rpm

          # "rpm -K"はrpmdbのキーリングで検証するため、リポジトリの公開鍵を使い捨てのrpmdbに取り込んでから検証する。
          # secretの秘密鍵とリポジトリの公開鍵が食い違う場合は、ここで失敗する
          rpm --dbpath "$RPMVERIFYDB" --initdb
          rpm --dbpath "$RPMVERIFYDB" --import gpg/RPM-GPG-KEY-Claude-Desktop-SUSE
          rpm --dbpath "$RPMVERIFYDB" -Kv ./*.rpm

      - name: Generate checksums
        run: sha256sum *.rpm > SHA256SUMS.txt

      - name: Sign SHA256SUMS with GPG
        if: steps.rpm-gpg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID="$(gpg --batch --list-keys --with-colons | awk -F: '/^pub:/ { getline; print $10; exit }')"
          test -n "$KEYID"
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 -u "$KEYID" \
            --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt 3<<< "${RPM_GPG_PASSPHRASE:-}"
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            *.rpm
            SHA256SUMS.txt
            SHA256SUMS.txt.asc
            gpg/RPM-GPG-KEY-Claude-Desktop-SUSE
