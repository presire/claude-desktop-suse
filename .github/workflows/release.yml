name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: opensuse-leap-16
            container: opensuse/leap:16.0
            label: openSUSE Leap 16
          - distro: opensuse-tumbleweed
            container: opensuse/tumbleweed
            label: openSUSE Tumbleweed

    name: Build RPM (${{ matrix.label }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.container }}

    steps:
      - name: Install git and dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive dist-upgrade -y --no-recommends
          zypper --non-interactive install -y --no-recommends \
            git-core tar gzip xz curl ca-certificates \
            p7zip wget icoutils ImageMagick rpm-build \
            make gcc gcc-c++

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get tag metadata
        id: meta
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Extract Claude upstream version from tag (e.g., v1.3.2+claude1.1.799 -> 1.1.799)
          claude_ver=$(echo "$tag" | grep -oP '(?<=\+claude)[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [[ -n $claude_ver ]]; then
            echo "claude_version=$claude_ver" >> "$GITHUB_OUTPUT"
          fi

          # Extract wrapper version (e.g., v1.3.2+claude1.1.799 -> 1.3.2)
          wrapper_ver=$(echo "$tag" | grep -oP '^v\K[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "wrapper_version=$wrapper_ver" >> "$GITHUB_OUTPUT"

      # Pin Claude to a verified release. The pin is kept deliberately,
      # because the release stream is not uniformly buildable. PR #4
      # resolved the code-split startup stub (_resolve_main_js now picks
      # the unique application chunk when index.js require()s several
      # chunks), but that only helps when the whole app lives in one
      # chunk. 1.26832.0 splits per feature instead: its index.js is a
      # 194 KB manifest of 107 chunk references, all 195 chunks are
      # distinct modules, and only a 6 KB chunk carries menuBarEnabled,
      # while "Config file written" and Tray-Win32 are gone outright -
      # so it cannot be patched. 2.110.0 (the newest release, and what
      # RELEASES serves when unpinned) keeps every anchor in one chunk.
      #
      # NOTE: the SHA-256 below is the amd64/x64 nupkg hash. Both matrix
      # entries build on x86_64, so a single hash covers them. Add an
      # arm64 matrix entry only alongside the matching --claude-sha256.
      - name: Build RPM package
        run: |
          chmod +x build.sh
          bash build.sh --build rpm --clean no --release-tag "${{ steps.meta.outputs.tag }}" \
            --claude-version 2.110.0 \
            --claude-sha256 ec6b1127751d936dbb4c6c71b92e6f2b9f034bc0d7f8f19fa6b390fd6f1f2563

      - name: Verify patch markers
        run: bash scripts/verify-patches.sh build/electron-app

      - name: Validate RPM artifact
        run: bash tests/test-artifact-rpm.sh .

      - name: Rename RPM with distro suffix
        id: artifact
        run: |
          rpm_file=$(find . -maxdepth 1 -name 'claude-desktop-*.rpm' -type f | head -n 1)
          if [[ -z $rpm_file ]]; then
            echo "::error::RPM file not found"
            exit 1
          fi

          base=$(basename "$rpm_file" .rpm)
          new_name="${base}.${{ matrix.distro }}.rpm"
          mv "$rpm_file" "$new_name"
          echo "rpm_file=$new_name" >> "$GITHUB_OUTPUT"
          echo "Built: $new_name"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}
          path: ${{ steps.artifact.outputs.rpm_file }}
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List artifacts
        run: ls -lh *.rpm

      - name: Generate checksums
        run: sha256sum *.rpm > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.rpm
            SHA256SUMS.txt
