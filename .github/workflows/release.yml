name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'build.sh'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  #=============================================================================
  # Build matrix: openSUSE Leap 16 — AppImage for amd64 / arm64
  #=============================================================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-22.04-arm

    name: build-${{ matrix.arch }}-appimage
    runs-on: ${{ matrix.runner }}
    container:
      image: opensuse/leap:16.0

    steps:
      - name: Install system dependencies
        run: |
          # zypper inside the container runs as root — no sudo needed.
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            git tar gzip findutils which \
            p7zip wget icoutils ImageMagick \
            gcc-c++ make \
            libfuse2

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build AppImage
        run: |
          TAG_FLAG=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_FLAG="--release-tag ${{ github.ref_name }}"
          fi
          chmod +x ./build.sh
          ./build.sh --build appimage $TAG_FLAG

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}-appimage
          if-no-files-found: error
          path: |
            claude-desktop*.AppImage

  #=============================================================================
  # Release — create GitHub Release on tag push
  #=============================================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ---- Download all build artifacts ----
      - name: Download amd64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: package-amd64-appimage
          path: artifacts/

      - name: Download arm64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: package-arm64-appimage
          path: artifacts/

      # ---- Generate release notes ----
      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Extract Claude Desktop version from tag
          # e.g. v1.3.26+claude1.1.9669 -> 1.1.9669
          CLAUDE_VER="${TAG#*+claude}"
          WRAPPER_VER="${TAG#v}"
          WRAPPER_VER="${WRAPPER_VER%%+*}"

          # Collect commit log since previous tag (if any)
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1) || true
          COMMITS=""
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..${TAG}" -- 2>/dev/null \
              | sed 's/^/- /') || true
          fi

          cat > release-notes.md << 'NOTES_EOF'
          ## Claude Desktop for openSUSE / SLE — ${TAG}

          Upstream Claude Desktop version: **${CLAUDE_VER}**
          Wrapper version: **${WRAPPER_VER}**

          ### Changes
          NOTES_EOF

          # Use envsubst-style expansion (heredoc is literal, so expand now)
          sed -i "s|\${TAG}|${TAG}|g"               release-notes.md
          sed -i "s|\${CLAUDE_VER}|${CLAUDE_VER}|g" release-notes.md
          sed -i "s|\${WRAPPER_VER}|${WRAPPER_VER}|g" release-notes.md

          if [[ -n "$COMMITS" ]]; then
            echo "$COMMITS" >> release-notes.md
          else
            echo "- Initial release" >> release-notes.md
          fi

          cat >> release-notes.md << 'INSTALL_EOF'

          ### Installation

          **AppImage**
          ```bash
          chmod +x claude-desktop-*.AppImage
          ./claude-desktop-*.AppImage
          ```
          INSTALL_EOF
        env:
          GIT_DIR: ''

      - name: Checkout for git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate release notes with history
        run: |
          TAG="${GITHUB_REF_NAME}"
          CLAUDE_VER="${TAG#*+claude}"
          WRAPPER_VER="${TAG#v}"
          WRAPPER_VER="${WRAPPER_VER%%+*}"

          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 2>/dev/null) || true
          COMMITS=""
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..${TAG}" 2>/dev/null \
              | sed 's/^/- /') || true
          fi

          cat > release-notes.md << EOF
          ## Claude Desktop for openSUSE / SLE — ${TAG}

          Upstream Claude Desktop version: **${CLAUDE_VER}**
          Wrapper version: **${WRAPPER_VER}**

          ### Changes
          EOF

          if [[ -n "$COMMITS" ]]; then
            echo "$COMMITS" >> release-notes.md
          else
            echo "- Initial release" >> release-notes.md
          fi

          cat >> release-notes.md << 'INSTALL_EOF'

          ### Installation

          **AppImage**
          ```bash
          chmod +x claude-desktop-*.AppImage
          ./claude-desktop-*.AppImage
          ```
          INSTALL_EOF

      # ---- Create release ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          draft: false
          prerelease: false

