name: BATS Tests
run-name: |
  BATS: ${{
    github.event_name == 'pull_request' && format('PR #{0} by @{1} - {2}', github.event.pull_request.number, github.actor, github.event.pull_request.title) ||
    github.event_name == 'push' && github.event.head_commit && format('Push by @{0} - {1}', github.actor, github.event.head_commit.message) ||
    format('{0} triggered by @{1}', github.event_name, github.actor)
  }}

on:
  push:
    branches:
      - main
    paths:
      - "build.sh"
      - "tests/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    name: BATS unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install BATS and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y bats nodejs npm
          npm install --no-save --package-lock=false --ignore-scripts acorn@8.19.0

      - name: Check script syntax
        # bash -n parses only its first operand (the rest become $1, $2, ...),
        # so check each script separately. .bats files are parsed by bats.
        run: |
          status=0
          for file in build.sh scripts/*.sh scripts/setup/*.sh scripts/staging/*.sh \
            scripts/patches/*.sh scripts/packaging/*.sh tests/*.sh tools/*.sh; do
            bash -n "$file" || status=1
          done
          exit "$status"

      - name: Check JS syntax
        run: |
          status=0
          for file in scripts/*.js scripts/patches/*.cjs tools/*.js; do
            node --check "$file" || status=1
          done
          exit "$status"

      - name: Run BATS test suite
        run: bats --print-output-on-failure tests/*.bats
